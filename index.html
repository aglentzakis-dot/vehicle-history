// ---------- Minimal localStorage-backed storage shim ----------
// (Mirrors the shape of Claude's artifact window.storage API so the
// rest of the app code needs no further changes.)
const storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    } catch { return null; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, value); return { key, value }; }
    catch { return null; }
  },
};

// ---------- Lucide icon adapter ----------
// Renders any lucide icon by name using the globally-loaded `lucide` UMD
// bundle, so the JSX below can keep using <Plus/>, <X/>, etc. unchanged.
function LucideIcon({ iconName, size = 18, className = "", strokeWidth = 2, ...rest }) {
  const def = window.lucide && window.lucide.icons && window.lucide.icons[iconName];
  if (!def) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} {...rest}>
      {def.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
    </svg>
  );
}

function BrandAutocomplete({ value, onChange, brands, placeholder }) {
  const [open, setOpen] = useState(false);
  const wrapRef = React.useRef(null);

  useEffect(() => {
    const onClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  const matches = value.trim()
    ? brands.filter((b) => b.toLowerCase().includes(value.trim().toLowerCase()))
    : brands;

  return (
    <div ref={wrapRef} className="relative">
      <input
        value={value}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        placeholder={placeholder}
        name="brand-field"
        {...noAutofill}
        onFocus={(e) => { setOpen(true); keepVisible(e); }}
        className="w-full font-body rounded-lg bg-black ring-1 ring-white/15 px-3 py-2.5 text-zinc-50 placeholder-zinc-500 outline-none focus:ring-amber-400/50"

// Keeps the focused field visible above the on-screen keyboard on mobile,

const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("el-GR", { day: "2-digit", month: "short", year: "numeric" });
};
const fmtKm = (n) => (n || n === 0 ? Number(n).toLocaleString("el-GR") + " χλμ" : "—");
const daysBetween = (fromISO, toISO) => {
  const a = new Date(fromISO + "T00:00:00");
  const b = new Date(toISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
};

};

function kteoStatus(vehicle) {
  if (!vehicle.kteoExpiry) return { level: "unknown", label: "Δεν έχει οριστεί", days: null };
  const days = daysBetween(todayISO(), vehicle.kteoExpiry);
  if (days < 0) return { level: "danger", label: `Έληξε πριν ${Math.abs(days)} ημέρες`, days };
  if (days <= 30) return { level: "warn", label: `Λήγει σε ${days} ημέρες`, days };
  return { level: "ok", label: `Ισχύει ακόμη ${days} ημέρες`, days };
}

function avgKmPerYear(vehicle) {
  if (!vehicle.purchaseDate) return null;
  const days = daysBetween(vehicle.purchaseDate, todayISO());
  const years = Math.max(days / 365, 30 / 365); // avoid absurd rates in the first month
  const kmAtPurchase = Number(vehicle.kmAtPurchase) || 0;
  const currentKm = Number(vehicle.currentKm) || 0;
  const kmDriven = currentKm - kmAtPurchase;
  if (kmDriven <= 0 || days <= 0) return null;
  return kmDriven / years;
}

function oilStatus(vehicle) {
  const avgKm = avgKmPerYear(vehicle);
  if (!vehicle.lastOilDate || vehicle.lastOilKm == null) {
    return { level: "unknown", label: "Δεν υπάρχει καταγραφή αλλαγής λαδιών", remKm: null, remDays: null, avgKm };
  }
  const lastOilKm = Number(vehicle.lastOilKm) || 0;
  const currentKm = Number(vehicle.currentKm) || 0;
  const intervalKm = Number(vehicle.oilIntervalKm) || 10000;
  const intervalMonths = Number(vehicle.oilIntervalMonths) || 12;
  const nextKm = lastOilKm + intervalKm;
  const nextDateDays = intervalMonths * 30;
  const nextDate = new Date(new Date(vehicle.lastOilDate + "T00:00:00").getTime() + nextDateDays * 86400000)
    .toISOString().slice(0, 10);
  const remKm = nextKm - currentKm;
  const remDays = daysBetween(todayISO(), nextDate);

  // Estimated calendar date the km-based interval will be reached, based on
  // the vehicle's actual average yearly usage (from purchase date/odometer).
  let estMonths = null, estDate = null;
  if (avgKm && remKm > 0) {
    estMonths = Math.round((remKm / avgKm) * 12);
    estDate = new Date(Date.now() + (remKm / avgKm) * 365 * 86400000).toISOString().slice(0, 10);
  }

  let level = "ok";
  if (remKm <= 0 || remDays <= 0) level = "danger";
  else if (remKm <= 1000 || remDays <= 30) level = "warn";
  return { level, remKm, remDays, nextKm, nextDate, avgKm, estMonths, estDate };
}

function StatusPill({ level, children, icon: Icon }) {

  return (

      <span className={`h-1.5 w-1.5 rounded-full ${s.dot}`} />
      {Icon ? <Icon size={12} /> : null}
      {children}
    </span>
  );
}

function GaugeArc({ pct, level, label, sublabel }) {
  const s = LEVEL_STYLES[level] || LEVEL_STYLES.unknown;
  const clamped = Math.max(0, Math.min(100, pct));
  const circumference = 2 * Math.PI * 40;
  const strokeColor = level === "ok" ? "#34d399" : level === "warn" ? "#fbbf24" : level === "danger" ? "#fb7185" : "#71717a";
  return (
    <div className="relative flex flex-col items-center justify-center">
      <svg width="112" height="112" viewBox="0 0 100 100" className="-rotate-90">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#2B2C31" strokeWidth="9" />
        <circle
          cx="50" cy="50" r="40" fill="none" stroke={strokeColor} strokeWidth="9"
          strokeDasharray={circumference} strokeDashoffset={circumference * (1 - clamped / 100)}
          strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.6s ease" }}
        />
      </svg>
      <div className="absolute flex flex-col items-center">
        <span className={`font-mono font-bold text-lg ${s.text}`}>{label}</span>
        <span className="font-body text-xs text-zinc-400 mt-0.5 text-center px-2">{sublabel}</span>
      </div>
    </div>
  );
}

// ---------- Category / Sub-category Manager ----------
function CategoryManager({ categories, onChange, onClose }) {
  const [expanded, setExpanded] = useState(null);
  const [newLabel, setNewLabel] = useState("");
  const [newColor, setNewColor] = useState(COLOR_KEYS[0]);
  const [newIcon, setNewIcon] = useState(ICON_KEYS[0]);
  const [showAddCategory, setShowAddCategory] = useState(false);
  const [newItemText, setNewItemText] = useState({});
  const [renamingKey, setRenamingKey] = useState(null);
  const [renameValue, setRenameValue] = useState("");
  const [renamingItem, setRenamingItem] = useState(null); // `${catKey}::${item}`
  const [renameItemValue, setRenameItemValue] = useState("");

  const moveCategory = (idx, dir) => {
    const next = [...categories];
    const j = idx + dir;
    if (j < 0 || j >= next.length) return;
    [next[idx], next[j]] = [next[j], next[idx]];
    onChange(next);
  };

  const moveItem = (catKey, idx, dir) => {
    const next = categories.map((c) => {
      if (c.key !== catKey) return c;
      const items = [...c.items];
      const j = idx + dir;
      if (j < 0 || j >= items.length) return c;
      [items[idx], items[j]] = [items[j], items[idx]];
      return { ...c, items };
    });
    onChange(next);
  };

  const removeCategory = (key) => onChange(categories.filter((c) => c.key !== key));

  const removeItem = (catKey, item) => onChange(categories.map((c) =>
    c.key === catKey ? { ...c, items: c.items.filter((i) => i !== item) } : c
  ));

  const addItem = (catKey) => {
    const text = (newItemText[catKey] || "").trim();
    if (!text) return;
    onChange(categories.map((c) =>
      c.key === catKey && !c.items.includes(text) ? { ...c, items: [...c.items, text] } : c
    ));
    setNewItemText((p) => ({ ...p, [catKey]: "" }));
  };

  const renameCategory = (key) => {
    const label = renameValue.trim();
    if (label) onChange(categories.map((c) => (c.key === key ? { ...c, label } : c)));
    setRenamingKey(null);
  };

  const renameItem = (catKey, oldItem) => {
    const label = renameItemValue.trim();
    if (label) {
      onChange(categories.map((c) =>
        c.key === catKey ? { ...c, items: c.items.map((i) => (i === oldItem ? label : i)) } : c
      ));
    }
    setRenamingItem(null);
  };

  const addCategory = () => {
    const label = newLabel.trim();
    if (!label) return;
    onChange([...categories, { key: uid(), label, icon: newIcon, color: newColor, items: [] }]);
    setNewLabel(""); setNewColor(COLOR_KEYS[0]); setNewIcon(ICON_KEYS[0]); setShowAddCategory(false);
  };

  return (
    <div className="fixed inset-0 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm" style={{ zIndex: 60 }}>
      <div className="w-full sm:max-w-md overflow-y-auto bg-zinc-900 rounded-t-2xl sm:rounded-2xl ring-1 ring-white/15 p-5" style={{ maxHeight: "90vh" }}>
        <div className="flex items-center justify-between mb-1">
          <h2 className="font-display text-lg font-semibold text-zinc-50 uppercase tracking-wide flex items-center gap-1.5">
            <Layers size={17} className="text-amber-400" /> Κατηγορίες service
          </h2>
          <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200 p-1"><X size={20} /></button>
        </div>
        <p className="font-body text-xs text-zinc-500 mb-4">Πρόσθεσε, αφαίρεσε ή αλλάξε σειρά σε κατηγορίες και στοιχεία τους.</p>

        <div className="space-y-2 mb-4">
          {categories.map((cat, idx) => {
            const s = CATEGORY_STYLES[cat.color] || CATEGORY_STYLES.amber;
            const Icon = ICON_MAP[cat.icon] || Cog;
            const isOpen = expanded === cat.key;
            return (
              <div key={cat.key} className="rounded-xl bg-black/40 ring-1 ring-white/10 overflow-hidden">
                <div className="flex items-center gap-2 p-2.5">
                  <span className={`h-7 w-7 rounded-lg flex items-center justify-center shrink-0 ${s.chip}`}>
                    <Icon size={14} />
                  </span>
                  {renamingKey === cat.key ? (
                    <input value={renameValue} onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && renameCategory(cat.key)}
                      autoFocus name={`rename-${cat.key}`} {...noAutofill}
                      className="flex-1 font-body text-sm rounded-lg bg-black ring-1 ring-amber-400/50 px-2 py-1 text-zinc-50 outline-none" />
                  ) : (
                    <button onClick={() => setExpanded(isOpen ? null : cat.key)} className="flex-1 text-left font-body text-sm font-medium text-zinc-200 truncate">
                      {cat.label} <span className="text-zinc-500 font-normal">· {cat.items.length}</span>
                    </button>
                  )}
                  <div className="flex items-center gap-0.5 shrink-0">
                    {renamingKey === cat.key ? (
                      <button onClick={() => renameCategory(cat.key)} className="p-1.5 text-emerald-400"><CheckCircle2 size={15} /></button>
                    ) : (
                      <button onClick={() => { setRenamingKey(cat.key); setRenameValue(cat.label); }} className="p-1.5 text-zinc-400 hover:text-zinc-200"><PenLine size={13} /></button>
                    )}
                    <button onClick={() => moveCategory(idx, -1)} disabled={idx === 0} className="p-1.5 text-zinc-400 disabled:opacity-20 hover:text-zinc-200"><ChevronUp size={15} /></button>
                    <button onClick={() => moveCategory(idx, 1)} disabled={idx === categories.length - 1} className="p-1.5 text-zinc-400 disabled:opacity-20 hover:text-zinc-200"><ChevronDown size={15} /></button>
                    <button onClick={() => removeCategory(cat.key)} className="p-1.5 text-zinc-400 hover:text-rose-400"><Trash2 size={13} /></button>
                  </div>
                </div>

                {isOpen && (
                  <div className="px-2.5 pb-2.5 space-y-1.5 border-t border-white/5 pt-2.5">
                    {cat.items.map((item, i) => {
                      const itemKey = `${cat.key}::${item}`;
                      const isRenaming = renamingItem === itemKey;
                      return (
                        <div key={item} className="flex items-center gap-1.5 rounded-lg bg-white/5 px-2.5 py-1.5">
                          {isRenaming ? (
                            <input value={renameItemValue} onChange={(e) => setRenameItemValue(e.target.value)}
                              onKeyDown={(e) => e.key === "Enter" && renameItem(cat.key, item)}
                              autoFocus name={`rename-item-${itemKey}`} {...noAutofill}
                              className="flex-1 font-body text-xs rounded-lg bg-black ring-1 ring-amber-400/50 px-2 py-1 text-zinc-50 outline-none" />
                          ) : (
                            <span className="flex-1 font-body text-xs text-zinc-200 truncate">{item}</span>
                          )}
                          {isRenaming ? (
                            <button onClick={() => renameItem(cat.key, item)} className="p-1 text-emerald-400"><CheckCircle2 size={14} /></button>
                          ) : (
                            <button onClick={() => { setRenamingItem(itemKey); setRenameItemValue(item); }} className="p-1 text-zinc-500 hover:text-zinc-200"><PenLine size={12} /></button>
                          )}
                          <button onClick={() => moveItem(cat.key, i, -1)} disabled={i === 0} className="p-1 text-zinc-500 disabled:opacity-20 hover:text-zinc-200"><ChevronUp size={13} /></button>
                          <button onClick={() => moveItem(cat.key, i, 1)} disabled={i === cat.items.length - 1} className="p-1 text-zinc-500 disabled:opacity-20 hover:text-zinc-200"><ChevronDown size={13} /></button>
                          <button onClick={() => removeItem(cat.key, item)} className="p-1 text-zinc-500 hover:text-rose-400"><X size={13} /></button>
                        </div>
                      );
                    })}
                    <div className="flex gap-1.5 pt-1">
                      <input value={newItemText[cat.key] || ""} onChange={(e) => setNewItemText((p) => ({ ...p, [cat.key]: e.target.value }))}
                        onKeyDown={(e) => e.key === "Enter" && addItem(cat.key)}
                        placeholder="Νέο στοιχείο..." name={`new-item-${cat.key}`} {...noAutofill}
                        className="flex-1 font-body text-xs rounded-lg bg-black ring-1 ring-white/15 px-2.5 py-1.5 text-zinc-50 placeholder-zinc-500 outline-none focus:ring-amber-400/50" />
                      <button onClick={() => addItem(cat.key)} className="rounded-lg px-2.5 bg-zinc-800 text-zinc-200 ring-1 ring-white/15"><Plus size={14} /></button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {showAddCategory ? (
          <div className="rounded-xl bg-black/40 ring-1 ring-white/10 p-3 mb-3 space-y-2.5">
            <input value={newLabel} onChange={(e) => setNewLabel(e.target.value)} placeholder="Όνομα κατηγορίας"
              name="new-category-label" {...noAutofill} autoFocus
              className="w-full font-body text-sm rounded-lg bg-black ring-1 ring-white/15 px-3 py-2 text-zinc-50 placeholder-zinc-500 outline-none focus:ring-amber-400/50" />
            <div>
              <p className="font-body text-xs text-zinc-500 mb-1.5">Χρώμα</p>
              <div className="flex gap-1.5 flex-wrap">
                {COLOR_KEYS.map((c) => (
                  <button key={c} onClick={() => setNewColor(c)}
                    className={`h-7 w-7 rounded-full ${CATEGORY_STYLES[c].dot} ${newColor === c ? "ring-2 ring-offset-2 ring-offset-zinc-900 ring-white" : "opacity-50"}`} />
                ))}
              </div>
            </div>
            <div>
              <p className="font-body text-xs text-zinc-500 mb-1.5">Εικονίδιο</p>
              <div className="flex gap-1.5 flex-wrap">
                {ICON_KEYS.map((k) => {
                  const I = ICON_MAP[k];
                  return (
                    <button key={k} onClick={() => setNewIcon(k)}
                      className={`h-8 w-8 rounded-lg flex items-center justify-center ring-1 ${newIcon === k ? "bg-amber-400/15 ring-amber-400/50 text-amber-300" : "bg-white/5 ring-white/10 text-zinc-400"}`}>
                      <I size={15} />
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex gap-2 pt-1">
              <button onClick={() => setShowAddCategory(false)} className="flex-1 rounded-lg py-2 bg-zinc-800 text-zinc-300 font-body text-xs font-medium ring-1 ring-white/10">Άκυρο</button>
              <button onClick={addCategory} disabled={!newLabel.trim()}
                className="flex-1 rounded-lg py-2 bg-amber-400 text-zinc-900 font-body text-xs font-semibold disabled:opacity-40">Προσθήκη</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setShowAddCategory(true)}
            className="w-full flex items-center justify-center gap-1.5 rounded-xl py-2.5 bg-white/5 text-zinc-300 ring-1 ring-white/10 font-body text-sm font-medium mb-3">
            <FolderPlus size={15} /> Νέα κατηγορία
          </button>
        )}

        <button onClick={onClose} className="w-full rounded-xl py-2.5 bg-amber-400 text-zinc-900 font-body text-sm font-semibold">
          Έτοιμο
        </button>
      </div>
    </div>
  );
}

function VehicleDetail({ vehicle, records, categories, onCategoriesChange, onBack, onEdit, onQuickUpdate, onAddRecord, onEditRecord, onDeleteRecord }) {

            className="w-full text-left rounded-2xl ring-1 ring-white/10 bg-zinc-900 p-4 active:opacity-80 transition">
            <div className="flex items-start justify-between mb-2">

              </div>
              <div className="flex items-center gap-2">
                {r.cost != null && <span className="font-mono text-xs text-amber-400/90">{r.cost.toLocaleString("el-GR")}€</span>}
                <span onClick={(e) => { e.stopPropagation(); onDeleteRecord(r.id); }}

            <div className="flex flex-wrap gap-1.5 mb-1.5">

      {showForm && (
        <ServiceForm vehicle={vehicle} categories={categories} onCategoriesChange={onCategoriesChange} onCancel={() => setShowForm(false)}
          onSave={(rec) => { onAddRecord(rec); setShowForm(false); }} />

      {editingRecord && (
        <ServiceForm vehicle={vehicle} initial={editingRecord} categories={categories} onCategoriesChange={onCategoriesChange} onCancel={() => setEditingRecord(null)}
          onSave={(rec) => { onEditRecord(rec); setEditingRecord(null); }}
          onDelete={(id) => { onDeleteRecord(id); setEditingRecord(null); }} />
      )}
      {showKteoEdit && (
        <KteoQuickEdit vehicle={vehicle} onCancel={() => setShowKteoEdit(false)}
          onSave={(patch) => { onQuickUpdate(vehicle.id, patch); setShowKteoEdit(false); }} />
      )}
      {showOilEdit && (

          onSave={(patch) => { onQuickUpdate(vehicle.id, patch); setShowOilEdit(false); }} />
      )}
    </div>
  );
}

// ---------- Main App ----------
function VehicleHistoryApp() {
  const [vehicles, setVehicles] = useState([]);
  const [records, setRecords] = useState({}); // { vehicleId: [records] }
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [loaded, setLoaded] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [showVehicleForm, setShowVehicleForm] = useState(false);
  const [editingVehicle, setEditingVehicle] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const v = await storage.get("vehicles");
        const list = v ? JSON.parse(v.value) : [];
        setVehicles(list);
        const recEntries = await Promise.all(list.map(async (veh) => {
          try {
            const r = await storage.get(`service:${veh.id}`);
            return [veh.id, r ? JSON.parse(r.value) : []];
          } catch { return [veh.id, []]; }
        }));
        setRecords(Object.fromEntries(recEntries));
      } catch (e) {
        setVehicles([]);
      }
      try {
        const c = await storage.get("service-categories");
        if (c) setCategories(JSON.parse(c.value));
      } catch (e) { /* keep defaults */ }
      setLoaded(true);
    })();
  }, []);

  const persistCategories = async (list) => {
    setCategories(list);
    try { await storage.set("service-categories", JSON.stringify(list)); }
    catch { setError("Αποτυχία αποθήκευσης."); }
  };

  const persistVehicles = async (list) => {
    setVehicles(list);
    try {
      await storage.set("vehicles", JSON.stringify(list));
    } catch {
      try { await storage.set("vehicles", JSON.stringify(list)); }
      catch { setError("Αποτυχία αποθήκευσης."); }
    }
  };

  const persistRecords = async (vehicleId, list) => {
    setRecords((prev) => ({ ...prev, [vehicleId]: list }));
    try {
      await storage.set(`service:${vehicleId}`, JSON.stringify(list));
    } catch {
      try { await storage.set(`service:${vehicleId}`, JSON.stringify(list)); }
      catch { setError("Αποτυχία αποθήκευσης."); }
    }
  };

  const saveVehicle = (vehicle) => {
    const exists = vehicles.some((v) => v.id === vehicle.id);
    const next = exists ? vehicles.map((v) => (v.id === vehicle.id ? vehicle : v)) : [...vehicles, vehicle];
    persistVehicles(next);
    if (!exists) setRecords((prev) => ({ ...prev, [vehicle.id]: [] }));
    setShowVehicleForm(false);
    setEditingVehicle(null);
  };

  const deleteVehicle = (id) => {
    persistVehicles(vehicles.filter((v) => v.id !== id));
    setRecords((prev) => { const n = { ...prev }; delete n[id]; return n; });
    setShowVehicleForm(false);
    setEditingVehicle(null);
    if (selectedId === id) setSelectedId(null);
  };

  const quickUpdateVehicle = (id, patch) => {
    persistVehicles(vehicles.map((v) => (v.id === id ? { ...v, ...patch } : v)));
  };

  const recomputeOilFields = (veh, list) => {
    const oilRecords = list.filter((r) => r.items.includes("Αλλαγή λαδιών κινητήρα"));
    let lastOilKm = null, lastOilDate = null;
    if (oilRecords.length) {
      const latest = [...oilRecords].sort((a, b) => (a.date < b.date ? 1 : -1))[0];
      lastOilKm = Number(latest.km) || 0;
      lastOilDate = latest.date;
    }
    const maxKm = list.reduce((m, r) => Math.max(m, Number(r.km) || 0), Number(veh.currentKm) || 0);
    return { ...veh, lastOilKm, lastOilDate, currentKm: maxKm };
  };

  const addRecord = async (vehicleId, rec) => {
    const list = [...(records[vehicleId] || []), rec];
    await persistRecords(vehicleId, list);
    const veh = vehicles.find((v) => v.id === vehicleId);
    if (veh) await persistVehicles(vehicles.map((v) => (v.id === vehicleId ? recomputeOilFields(veh, list) : v)));
  };

  const editRecord = async (vehicleId, rec) => {
    const list = (records[vehicleId] || []).map((r) => (r.id === rec.id ? rec : r));
    await persistRecords(vehicleId, list);
    const veh = vehicles.find((v) => v.id === vehicleId);
    if (veh) await persistVehicles(vehicles.map((v) => (v.id === vehicleId ? recomputeOilFields(veh, list) : v)));
  };

  const deleteRecord = async (vehicleId, recId) => {
    const list = (records[vehicleId] || []).filter((r) => r.id !== recId);
    await persistRecords(vehicleId, list);
    const veh = vehicles.find((v) => v.id === vehicleId);
    if (veh) await persistVehicles(vehicles.map((v) => (v.id === vehicleId ? recomputeOilFields(veh, list) : v)));
  };

  const selected = vehicles.find((v) => v.id === selectedId);

  const sortedVehicles = useMemo(() => {
    const rank = (v) => {
      const k = kteoStatus(v), o = oilStatus(v);
      const lv = (s) => (s === "danger" ? 0 : s === "warn" ? 1 : s === "unknown" ? 2 : 3);
      return Math.min(lv(k.level), lv(o.level));
    };
    return [...vehicles].sort((a, b) => rank(a) - rank(b));
  }, [vehicles]);

  const alerts = useMemo(() => vehicles.filter((v) => {
    const k = kteoStatus(v), o = oilStatus(v);
    return k.level === "danger" || k.level === "warn" || o.level === "danger" || o.level === "warn";
  }), [vehicles]);

  if (!loaded) {
    return (
      <div className="h-full min-h-screen flex items-center justify-center bg-zinc-950">
        <style>{FONT_STYLE}</style>
        <Gauge className="text-amber-400 animate-pulse" size={28} />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-50">
      <style>{FONT_STYLE}</style>

      {selected ? (
        <VehicleDetail
          vehicle={selected}
          records={records[selected.id] || []}
          categories={categories}
          onCategoriesChange={persistCategories}
          onBack={() => setSelectedId(null)}
          onEdit={(v) => setEditingVehicle(v)}
          onQuickUpdate={quickUpdateVehicle}
          onAddRecord={(rec) => addRecord(selected.id, rec)}
          onEditRecord={(rec) => editRecord(selected.id, rec)}
          onDeleteRecord={(id) => deleteRecord(selected.id, id)}
        />
      ) : (
        <div className="pb-8">
          <div className="px-4 pt-5 pb-4">
            <p className="font-body text-xs text-amber-400/80 font-medium uppercase tracking-widest mb-0.5">Γκαράζ</p>
            <h1 className="font-display text-2xl font-bold text-zinc-50 uppercase tracking-wide">Ιστορικό οχημάτων</h1>
          </div>

          {alerts.length > 0 && (
            <div className="px-4 mb-4">
              <div className="rounded-2xl bg-amber-400/10 ring-1 ring-amber-400/30 p-3.5 flex items-start gap-2.5">
                <AlertTriangle size={17} className="text-amber-400 shrink-0 mt-0.5" />
                <div>
                  <p className="font-body text-sm font-medium text-amber-300">
                    {alerts.length} {alerts.length === 1 ? "όχημα χρειάζεται προσοχή" : "οχήματα χρειάζονται προσοχή"}
                  </p>
                  <p className="font-body text-xs text-amber-400/70 mt-0.5">ΚΤΕΟ ή αλλαγή λαδιών πλησιάζει ή έχει λήξει.</p>
                </div>
              </div>
            </div>
          )}

          <div className="px-4 space-y-3">
            {sortedVehicles.map((v) => <VehicleCard key={v.id} vehicle={v} onOpen={(veh) => setSelectedId(veh.id)} />)}
          </div>

          {vehicles.length === 0 && (
            <div className="px-4">
              <div className="rounded-2xl ring-1 ring-white/10 bg-zinc-900 p-8 text-center">
                <div className="h-12 w-12 rounded-2xl bg-amber-400/10 flex items-center justify-center mx-auto mb-3">
                  <Car size={22} className="text-amber-400" />
                </div>
                <p className="font-body text-sm text-zinc-300 font-medium mb-1">Δεν έχεις προσθέσει όχημα ακόμη</p>
                <p className="font-body text-xs text-zinc-400">Πρόσθεσε αυτοκίνητο ή μηχανή για να ξεκινήσεις το ιστορικό του.</p>
              </div>
            </div>
          )}

          <div className="px-4 mt-4">
            <button onClick={() => setShowVehicleForm(true)}
              className="w-full flex items-center justify-center gap-2 rounded-2xl py-3.5 bg-amber-400 text-zinc-900 font-body text-sm font-semibold">
              <Plus size={17} /> Προσθήκη οχήματος
            </button>
          </div>
        </div>
      )}

      {(showVehicleForm || editingVehicle) && (
        <VehicleForm
          initial={editingVehicle}
          onCancel={() => { setShowVehicleForm(false); setEditingVehicle(null); }}
          onSave={saveVehicle}
          onDelete={deleteVehicle}
        />
      )}

      {error && (
        <div className="fixed bottom-4 left-4 right-4 bg-rose-500/90 text-white text-xs font-body rounded-xl px-4 py-2.5 text-center">
          {error}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VehicleHistoryApp />);
</script>
</body>
</html>
