<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ιστορικό Οχημάτων</title>
<meta name="description" content="ΚΤΕΟ, αλλαγές λαδιών και ιστορικό service για τα οχήματά σου.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Οχήματα">
<style>
:root{
  --bg:#0b0b0d; --card:#17181c; --card2:#1f2026; --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16); --txt:#f4f4f5; --dim:#a1a1aa; --dim2:#71717a;
  --acc:#fbbf24; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --sky:#38bdf8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;width:100%;background:#000;color:var(--txt);
  border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;
  color-scheme:dark;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:rgba(251,191,36,.6)}
select{background-image:none}
textarea{resize:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.eyebrow{color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:2px}
.ttl{font-size:23px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.lbl{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.hint{font-size:12px;color:var(--dim2);margin-top:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:12px;padding:13px;font-size:14px;font-weight:600}
.btn-p{background:var(--acc);color:#18181b}
.btn-s{background:var(--card2);color:#e4e4e7;border:1px solid var(--line)}
.btn-d{background:rgba(244,63,94,.12);color:var(--bad);border:1px solid rgba(244,63,94,.3);flex:0 0 auto;padding:13px 15px}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:500;border:1px solid var(--line2);
  background:rgba(255,255,255,.06);color:#e4e4e7}
.chip.on{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.45)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:5px 10px;font-size:11.5px;font-weight:600}
.dot{width:6px;height:6px;border-radius:999px;flex:0 0 auto}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .unk{color:var(--dim)}
.bg-ok{background:rgba(52,211,153,.12)} .bg-warn{background:rgba(251,191,36,.12)}
.bg-bad{background:rgba(251,113,133,.12)} .bg-unk{background:rgba(161,161,170,.12)}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)}
.d-bad{background:var(--bad)} .d-unk{background:var(--dim2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gauge{display:flex;flex-direction:column;align-items:center;padding:14px 10px;text-align:center}
.gauge svg{transform:rotate(-90deg)}
.gwrap{position:relative;display:flex;align-items:center;justify-content:center}
.gtxt{position:absolute;display:flex;flex-direction:column;align-items:center}
.gval{font-size:19px;font-weight:700}
.gsub{font-size:10.5px;color:var(--dim);margin-top:1px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);
  border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;justify-content:between;margin-bottom:16px}
.x{margin-left:auto;color:var(--dim);padding:4px}
.fld{margin-bottom:12px}
.divider{border-top:1px solid var(--line);margin:14px 0 12px}
.ac{position:relative}
.aclist{position:absolute;z-index:20;top:calc(100% + 5px);left:0;right:0;max-height:190px;
  overflow-y:auto;background:#000;border:1px solid var(--line2);border-radius:10px;padding:4px}
.acitem{display:block;width:100%;text-align:left;padding:9px 11px;font-size:14px;
  color:#e4e4e7;border-radius:7px}
.acitem:active{background:rgba(251,191,36,.16);color:#fcd34d}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin:0 -2px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border-radius:12px;
  padding:9px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--dim)}
.tab.on{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.45)}
.cnt{background:rgba(0,0,0,.35);border-radius:999px;padding:2px 6px;font-size:10px}
.pool{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;
  padding:11px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:7px}
.rec{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px}
.rec:active{opacity:.75}
.tag{background:rgba(255,255,255,.07);border-radius:999px;padding:3px 9px;font-size:11.5px;color:#d4d4d8}
.empty{text-align:center;padding:26px 18px;color:var(--dim)}
.alert{display:flex;gap:10px;align-items:flex-start;background:rgba(251,191,36,.1);
  border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:13px;margin-bottom:14px}
.mgr{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);
  margin-bottom:8px;overflow:hidden}
.mgr-h{display:flex;align-items:center;gap:8px;padding:9px}
.mgr-b{padding:0 9px 9px;border-top:1px solid var(--line)}
.ic{display:flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:8px;flex:0 0 auto}
.iconbtn{padding:6px;color:var(--dim);flex:0 0 auto}
.iconbtn:disabled{opacity:.2}
.sub{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);
  border-radius:9px;padding:7px 10px;margin-top:7px}
.swatch{width:28px;height:28px;border-radius:999px;opacity:.45}
.swatch.on{opacity:1;outline:2px solid #fff;outline-offset:2px}
.toast{position:fixed;left:16px;right:16px;bottom:18px;z-index:80;background:rgba(244,63,94,.95);
  color:#fff;border-radius:12px;padding:12px;text-align:center;font-size:13px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em;flex:0 0 auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------------- Icons (inline, nothing loaded from the network) ------------- */
var ICONS = {
  plus:["M5 12h14","M12 5v14"],
  x:["M18 6 6 18","m6 6 12 12"],
  car:["M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2","M7 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0","M15 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0","M9 17h6"],
  bike:["M18.5 17.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z","M5.5 17.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z","M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z","M12 17.5V14l-3-3 4-3 2 3h2"],
  gauge:["m12 14 4-4","M3.34 19a10 10 0 1 1 17.32 0"],
  calendar:["M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5","M16 2v4","M8 2v4","M3 10h5","M17.5 17.5 16 16.3V14","M22 16a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z"],
  wrench:["M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"],
  back:["m15 18-6-6 6-6"],
  up:["m18 15-6-6-6 6"],
  down:["m6 9 6 6 6-6"],
  alert:["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z","M12 9v4","M12 17h.01"],
  check:["M22 11.08V12a10 10 0 1 1-5.93-9.14","m9 11 3 3L22 4"],
  trash:["M3 6h18","M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6","M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2","M10 11v6","M14 11v6"],
  settings:["M20 7h-9","M14 17H5","M17 14a3 3 0 1 0 0 6 3 3 0 0 0 0-6z","M7 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"],
  history:["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8","M3 3v5h5","M12 7v5l4 2"],
  droplet:["M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"],
  fuel:["M3 22h12","M4 9h10","M14 22V4c0-1-1-2-2-2H6C5 2 4 3 4 4v18","M14 13h2c1 0 2 1 2 2v3c0 1 1 1 1 1s1 0 1-1V9.8c0-.5-.2-1-.6-1.4L18 7"],
  save:["M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z","M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7","M7 3v4a1 1 0 0 0 1 1h7"],
  pen:["M12 20h9","M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"],
  disc:["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z","M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"],
  battery:["M16 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z","M22 11v2"],
  wind:["M12.8 19.6A2 2 0 1 0 14 16H2","M17.5 8a2.5 2.5 0 1 1 2 4H2","M9.8 4.4A2 2 0 1 1 11 8H2"],
  cog:["M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z","M12 2v2","M12 20v2","m4.9 4.9 1.4 1.4","m17.7 17.7 1.4 1.4","M2 12h2","M20 12h2","m4.9 19.1 1.4-1.4","m17.7 6.3 1.4-1.4"],
  spark:["m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z","M5 3v4","M3 5h4"],
  folder:["M12 10v6","M9 13h6","M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"],
  layers:["m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z","m22 12.5-9.17 4.16a2 2 0 0 1-1.66 0L2 12.5","m22 17.5-9.17 4.16a2 2 0 0 1-1.66 0L2 17.5"],
  trend:["M16 7h6v6","m22 7-8.5 8.5-5-5L2 17"]
};
function icon(name, size){
  var p = ICONS[name]; if(!p) return "";
  var d = p.map(function(x){ return '<path d="'+x+'"/>'; }).join("");
  var s = size || 18;
  return '<svg class="i" viewBox="0 0 24 24" style="width:'+s+'px;height:'+s+'px">'+d+'</svg>';
}

/* ---------------- Small helpers ---------------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function todayISO(){
  var d=new Date(), m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function num(v){ var n=Number(v); return isFinite(n)?n:0; }
function fmtDate(iso){
  if(!iso) return "—";
  var p=iso.split("-"); if(p.length!==3) return "—";
  var M=["Ιαν","Φεβ","Μαρ","Απρ","Μάι","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
  return Number(p[2])+" "+M[Number(p[1])-1]+" "+p[0];
}
function fmtKm(n){
  if(n==null||n==="") return "—";
  return num(n).toLocaleString("el-GR")+" χλμ";
}
function daysBetween(a,b){
  if(!a||!b) return null;
  var d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}
function addDays(iso,n){
  var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n);
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}

/* ---------------- Storage (device-local, survives restarts) ---------------- */
var DB = {
  read:function(key,fallback){
    try{ var v=localStorage.getItem(key); return v==null?fallback:JSON.parse(v); }
    catch(e){ return fallback; }
  },
  write:function(key,val){
    try{ localStorage.setItem(key,JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }
};

/* ---------------- Defaults ---------------- */
var DEFAULTS = { car:{km:10000,months:12}, moto:{km:3000,months:6} };

var DEFAULT_CATS = [
  {key:"engine",label:"Κινητήρας",icon:"cog",color:"amber",
   items:["Αλλαγή λαδιών κινητήρα","Φίλτρο λαδιού","Φίλτρο αέρα","Φίλτρο καυσίμου","Μπουζί","Ιμάντας χρονισμού / καδένα","Ψυκτικό υγρό"]},
  {key:"brakes",label:"Φρένα",icon:"disc",color:"rose",
   items:["Τακάκια φρένων εμπρός","Τακάκια φρένων πίσω","Δίσκοι φρένων","Υγρό φρένων"]},
  {key:"chassis",label:"Ανάρτηση & Ελαστικά",icon:"wind",color:"sky",
   items:["Ελαστικά","Αμορτισέρ","Αλυσίδα & γρανάζια (μηχανή)"]},
  {key:"electrical",label:"Ηλεκτρικά & Καμπίνα",icon:"battery",color:"emerald",
   items:["Μπαταρία","Φίλτρο καμπίνας (γύρης)"]},
  {key:"other",label:"Λοιπά",icon:"spark",color:"violet",
   items:["ΚΤΕΟ","Γενικό service"]}
];
var OIL_ITEM = "Αλλαγή λαδιών κινητήρα";

var COLORS = {
  amber:"#fbbf24", rose:"#fb7185", sky:"#38bdf8", emerald:"#34d399",
  violet:"#a78bfa", orange:"#fb923c", teal:"#2dd4bf", fuchsia:"#e879f9"
};
var COLOR_KEYS = Object.keys(COLORS);
var ICON_KEYS = ["cog","disc","wind","battery","spark","wrench","droplet","fuel","gauge","layers"];

var CAR_BRANDS = ["Toyota","Volkswagen","Opel","Peugeot","Renault","Citroën","Fiat","Ford","Hyundai","Kia","Nissan","Honda","Mazda","Suzuki","Škoda","Seat","BMW","Mercedes-Benz","Audi","Volvo","Mitsubishi","Chevrolet","Dacia","Mini","Smart","Alfa Romeo","Jeep","Land Rover","Lexus","Subaru","Chrysler","Jaguar","Porsche","Tesla","SsangYong","Lancia","Daihatsu"];
var MOTO_BRANDS = ["Yamaha","Honda","Suzuki","Kawasaki","Piaggio","Vespa","KTM","BMW Motorrad","Aprilia","Triumph","Ducati","Harley-Davidson","SYM","Kymco","Peugeot Motocycles","Benelli","Royal Enfield","Husqvarna","Derbi","MV Agusta","Malaguti"];

/* ---------------- Status calculations ---------------- */
function kteoStatus(v){
  if(!v.kteoExpiry) return {level:"unk",label:"Δεν έχει οριστεί",days:null};
  var d = daysBetween(todayISO(), v.kteoExpiry);
  if(d<0)  return {level:"bad", label:"Έληξε πριν "+Math.abs(d)+" ημέρες", days:d};
  if(d<=30)return {level:"warn",label:"Λήγει σε "+d+" ημέρες", days:d};
  return {level:"ok", label:"Ισχύει ακόμη "+d+" ημέρες", days:d};
}
function avgKmPerYear(v){
  if(!v.purchaseDate) return null;
  var days = daysBetween(v.purchaseDate, todayISO());
  if(days==null || days<=0) return null;
  var driven = num(v.currentKm) - num(v.kmAtPurchase);
  if(driven<=0) return null;
  var years = Math.max(days/365, 30/365);
  return driven/years;
}
function oilStatus(v){
  var avg = avgKmPerYear(v);
  if(!v.lastOilDate || v.lastOilKm==null)
    return {level:"unk",remKm:null,remDays:null,avg:avg,estMonths:null,nextDate:null};
  var intKm = num(v.oilIntervalKm)||10000;
  var intMo = num(v.oilIntervalMonths)||12;
  var nextKm = num(v.lastOilKm)+intKm;
  var nextDate = addDays(v.lastOilDate, intMo*30);
  var remKm = nextKm-num(v.currentKm);
  var remDays = daysBetween(todayISO(), nextDate);
  var estMonths=null;
  if(avg && remKm>0) estMonths = Math.round((remKm/avg)*12);
  var level="ok";
  if(remKm<=0 || remDays<=0) level="bad";
  else if(remKm<=1000 || remDays<=30) level="warn";
  return {level:level,remKm:remKm,remDays:remDays,nextKm:nextKm,
          nextDate:nextDate,avg:avg,estMonths:estMonths};
}
/* ---------------- App state ---------------- */
var S = {
  vehicles: DB.read("veh.vehicles", []),
  records:  DB.read("veh.records", {}),
  cats:     DB.read("veh.cats", DEFAULT_CATS),
  selected: null,
  modal: null,     // {type, ...}
  draft: {},       // scratch state for the open modal
  toast: ""
};
function saveVehicles(){ if(!DB.write("veh.vehicles",S.vehicles)) toast("Αποτυχία αποθήκευσης."); }
function saveRecords(){ if(!DB.write("veh.records",S.records)) toast("Αποτυχία αποθήκευσης."); }
function saveCats(){ if(!DB.write("veh.cats",S.cats)) toast("Αποτυχία αποθήκευσης."); }
function toast(m){ S.toast=m; render(); setTimeout(function(){ S.toast=""; render(); },2600); }

function recsOf(id){ return S.records[id] || []; }
function vehicleById(id){
  for(var i=0;i<S.vehicles.length;i++) if(S.vehicles[i].id===id) return S.vehicles[i];
  return null;
}
/* Recompute oil fields + odometer from the full service history. */
function syncFromHistory(id){
  var v = vehicleById(id); if(!v) return;
  var list = recsOf(id);
  var oils = list.filter(function(r){ return r.items.indexOf(OIL_ITEM)>=0; });
  if(oils.length){
    var latest = oils.slice().sort(function(a,b){ return a.date<b.date?1:-1; })[0];
    v.lastOilKm = num(latest.km); v.lastOilDate = latest.date;
  } else { v.lastOilKm=null; v.lastOilDate=null; }
  var max = num(v.currentKm);
  list.forEach(function(r){ if(num(r.km)>max) max=num(r.km); });
  v.currentKm = max;
  saveVehicles();
}

/* ---------------- Reusable bits ---------------- */
function statusPill(level,label){
  return '<span class="pill bg-'+level+' '+level+'">'+
    '<span class="dot d-'+level+'"></span>'+esc(label)+'</span>';
}
function gauge(level,val,sub,pct){
  var col = level==="ok"?"var(--ok)":level==="warn"?"var(--warn)":level==="bad"?"var(--bad)":"var(--dim2)";
  var C = 2*Math.PI*40, p = Math.max(0,Math.min(100,pct||0));
  return '<div class="gwrap">'+
    '<svg width="104" height="104" viewBox="0 0 100 100">'+
      '<circle cx="50" cy="50" r="40" fill="none" stroke="#2b2c31" stroke-width="9"/>'+
      '<circle cx="50" cy="50" r="40" fill="none" stroke="'+col+'" stroke-width="9"'+
      ' stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'"/>'+
    '</svg>'+
    '<span class="gtxt"><span class="gval '+level+'">'+esc(val)+'</span>'+
    '<span class="gsub">'+esc(sub)+'</span></span></div>';
}

/* ---------------- Screen: vehicle list ---------------- */
function viewList(){

    '<h2 style="font-size:13.5px;color:#d4d4d8;text-transform:uppercase;display:flex;align-items:center;gap:6px">'+
      '<span style="color:var(--dim)">'+icon("history",15)+'</span> Ιστορικό</h2>'+

        : '<button class="iconbtn" data-act="renCat" data-v="'+c.key+'">'+icon("pen",13)+'</button>')+
      '<button class="iconbtn" data-act="moveCat" data-v="'+c.key+'" data-dir="-1"'+(idx===0?" disabled":"")+'>'+icon("up",15)+'</button>'+
      '<button class="iconbtn" data-act="moveCat" data-v="'+c.key+'" data-dir="1"'+(idx===S.cats.length-1?" disabled":"")+'>'+icon("down",15)+'</button>'+
      '<button class="iconbtn" data-act="delCat" data-v="'+c.key+'">'+icon("trash",13)+'</button>'+
    '</div>';

    if(open){
      body += '<div class="mgr-b">';
      c.items.forEach(function(it,i){
        var ren = d.renItem===c.key+"::"+it;
        body += '<div class="sub">'+
          (ren
            ? txt("renItemVal",d.renItemVal,'style="flex:1;padding:5px 8px;font-size:12.5px"')
            : '<span style="flex:1;font-size:12.5px;min-width:0;overflow:hidden;'+
              'text-overflow:ellipsis;white-space:nowrap">'+esc(it)+'</span>')+
          (ren
            ? '<button class="iconbtn ok" data-act="renItemSave" data-v="'+c.key+'" data-i="'+esc(it)+'">'+icon("check",14)+'</button>'
            : '<button class="iconbtn" data-act="renItem" data-v="'+c.key+'" data-i="'+esc(it)+'">'+icon("pen",12)+'</button>')+
          '<button class="iconbtn" data-act="moveItem" data-v="'+c.key+'" data-i="'+esc(it)+'" data-dir="-1"'+(i===0?" disabled":"")+'>'+icon("up",13)+'</button>'+
          '<button class="iconbtn" data-act="moveItem" data-v="'+c.key+'" data-i="'+esc(it)+'" data-dir="1"'+(i===c.items.length-1?" disabled":"")+'>'+icon("down",13)+'</button>'+
          '<button class="iconbtn" data-act="delItem" data-v="'+c.key+'" data-i="'+esc(it)+'">'+icon("x",13)+'</button>'+
        '</div>';
      });
      body += '<div style="display:flex;gap:6px;margin-top:9px">'+
        txt("newItem_"+c.key,d["newItem_"+c.key],'placeholder="Νέο στοιχείο..." style="flex:1;padding:8px 10px;font-size:12.5px"')+
        '<button class="btn btn-s" style="flex:0 0 auto;padding:8px 11px" data-act="addItem" data-v="'+c.key+'">'+icon("plus",14)+'</button>'+
      '</div></div>';
    }
    body += '</div>';
  });

  if(d.addingCat){
    body += '<div class="mgr" style="padding:12px">'+
      txt("newCatLabel",d.newCatLabel,'placeholder="Όνομα κατηγορίας" style="margin-bottom:11px"')+
      '<div class="lbl">Χρώμα</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">'+
        COLOR_KEYS.map(function(k){
          return '<button class="swatch'+(d.newCatColor===k?" on":"")+'" data-act="pickColor" data-v="'+k+'" '+
            'style="background:'+COLORS[k]+'"></button>';
        }).join("")+'</div>'+
      '<div class="lbl">Εικονίδιο</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px">'+
        ICON_KEYS.map(function(k){
          var on = d.newCatIcon===k;
          return '<button class="ic" data-act="pickIcon" data-v="'+k+'" style="border:1px solid '+
            (on?"rgba(251,191,36,.5)":"var(--line)")+';background:'+(on?"rgba(251,191,36,.16)":"rgba(255,255,255,.05)")+
            ';color:'+(on?"#fcd34d":"var(--dim)")+'">'+icon(k,15)+'</button>';
        }).join("")+'</div>'+
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-s" style="flex:1;padding:9px;font-size:12.5px" data-act="cancelAddCat">Άκυρο</button>'+
        '<button class="btn btn-p" style="flex:1;padding:9px;font-size:12.5px" data-act="addCat"'+
          ((d.newCatLabel||"").trim()?"":" disabled")+'>Προσθήκη</button>'+
      '</div></div>';
  } else {
    body += '<button class="btn btn-s" style="width:100%;margin-bottom:4px" data-act="startAddCat">'+
      icon("folder",15)+' Νέα κατηγορία</button>';
  }

  return sheet("Κατηγορίες service","layers",body,
    '<button class="btn btn-p" style="flex:1" data-act="closeCats">Έτοιμο</button>');
}
/* ---------------- Render ---------------- */
var APP = document.getElementById("app");

function render(){
  var html = S.selected ? viewDetail(vehicleById(S.selected)) : viewList();
  if(S.modal==="vehicle")      html += modalVehicle();
  else if(S.modal==="service") html += modalService();
  else if(S.modal==="kteo")    html += modalKteo();
  else if(S.modal==="oil")     html += modalOil();
  else if(S.modal==="cats")    html += modalCats();
  if(S.toast) html += '<div class="toast">'+esc(S.toast)+'</div>';

  APP.innerHTML = html;

  // Restore focus + caret after a re-render, so typing is never interrupted.
  if(S.focus){
    var el = APP.querySelector('[name="'+S.focus+'"]');
    if(el){
      el.focus();
      try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
    }
  }
}

/* Keep every keystroke in the draft; re-render only when the UI must change. */
APP.addEventListener("input", function(e){
  var el = e.target, name = el.getAttribute("name");
  if(!name) return;
  S.focus = name;
  var v = el.value;
  if(el.getAttribute("inputmode")==="numeric") v = v.replace(/\D/g,"");
  if(el.getAttribute("inputmode")==="decimal") v = v.replace(/[^\d.]/g,"");
  if(name==="plate") v = v.toUpperCase();
  if(v!==el.value){ el.value = v; }
  S.draft[name] = v;

  // These change what is displayed, so they need a redraw.
  if(name==="brand"){ S.draft.acOpen = true; render(); }
  else if(name==="purchaseDate"||name==="kmAtPurchase"||name==="currentKm") render();
});

APP.addEventListener("change", function(e){
  var name = e.target.getAttribute("name");
  if(name) S.draft[name] = e.target.value;
});

// Keep the focused field above the on-screen keyboard.
APP.addEventListener("focusin", function(e){
  if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  S.focus = e.target.getAttribute("name");
  var el = e.target;
  setTimeout(function(){
    try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(err){}
  }, 280);
});

/* ---------------- Actions ---------------- */
APP.addEventListener("click", function(e){
  var btn = e.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.getAttribute("data-act");
  var v   = btn.getAttribute("data-v");
  var id  = btn.getAttribute("data-id");
  var it  = btn.getAttribute("data-i");
  var dir = Number(btn.getAttribute("data-dir")||0);

  // Clicking inside the sheet must not close it.
  if(act==="backdrop" && e.target.closest("[data-stop]")) return;
  if(act==="backdrop"){ goBack(); return; }

  var d = S.draft, veh = S.selected?vehicleById(S.selected):null;

  switch(act){

  /* -- navigation -- */
  case "open":  S.selected=id; pushLayer(); window.scrollTo(0,0); break;
  case "back":  goBack(); return;
  case "close": goBack(); return;

  /* -- vehicle -- */
  case "newVehicle":
    S.modal="vehicle"; pushLayer();
    S.draft={type:"car",plate:"",brand:"",model:"",year:"",currentKm:"",kteoExpiry:"",
             oilIntervalKm:DEFAULTS.car.km,oilIntervalMonths:DEFAULTS.car.months,
             purchaseDate:"",kmAtPurchase:""};
    break;
  case "editVehicle":
    S.modal="vehicle"; pushLayer();
    S.draft={id:veh.id,type:veh.type,plate:veh.plate,brand:veh.brand,model:veh.model||"",
             year:veh.year||"",currentKm:veh.currentKm||"",kteoExpiry:veh.kteoExpiry||"",
             oilIntervalKm:veh.oilIntervalKm,oilIntervalMonths:veh.oilIntervalMonths,
             purchaseDate:veh.purchaseDate||"",kmAtPurchase:veh.kmAtPurchase||""};
    break;
  case "type":
    d.type=v;
    if(!d.id){ d.oilIntervalKm=DEFAULTS[v].km; d.oilIntervalMonths=DEFAULTS[v].months; }
    d.acOpen=false;
    break;
  case "pickBrand": d.brand=v; d.acOpen=false; S.focus=null; break;
  case "saveVehicle": {
    var rec = {
      id: d.id||uid(), type:d.type, plate:(d.plate||"").trim(), brand:(d.brand||"").trim(),
      model:(d.model||"").trim(), year:d.year?num(d.year):null, currentKm:num(d.currentKm),
      kteoExpiry:d.kteoExpiry||null,
      oilIntervalKm:num(d.oilIntervalKm)||DEFAULTS[d.type].km,
      oilIntervalMonths:num(d.oilIntervalMonths)||DEFAULTS[d.type].months,
      purchaseDate:d.purchaseDate||null, kmAtPurchase:num(d.kmAtPurchase)
    };
    var old = d.id?vehicleById(d.id):null;
    if(old){ rec.lastOilKm=old.lastOilKm; rec.lastOilDate=old.lastOilDate;
             for(var i=0;i<S.vehicles.length;i++) if(S.vehicles[i].id===rec.id) S.vehicles[i]=rec; }
    else { rec.lastOilKm=null; rec.lastOilDate=null; S.vehicles.push(rec); S.records[rec.id]=[]; saveRecords(); }
    saveVehicles();
    if(d.id) syncFromHistory(rec.id);
    goBack(); return;
  }
  case "deleteVehicle":
    if(!confirm("Διαγραφή οχήματος και όλου του ιστορικού του;")) return;
    S.vehicles = S.vehicles.filter(function(x){ return x.id!==d.id; });
    delete S.records[d.id];
    saveVehicles(); saveRecords();
    if(S.selected===d.id){ S.selected=null; consumeLayer(); }
    goBack(); return;

  /* -- quick edits -- */
  case "quickKteo": S.modal="kteo"; pushLayer(); S.draft={kteoExpiry:veh.kteoExpiry||""}; break;
  case "saveKteo":
    veh.kteoExpiry = d.kteoExpiry||null; saveVehicles(); goBack(); return;
  case "quickOil":
    S.modal="oil"; pushLayer();
    S.draft={lastOilDate:veh.lastOilDate||"",lastOilKm:veh.lastOilKm==null?"":veh.lastOilKm,
             oilIntervalKm:veh.oilIntervalKm,oilIntervalMonths:veh.oilIntervalMonths};
    break;
  case "saveOil":
    veh.lastOilDate = d.lastOilDate||null;
    veh.lastOilKm   = d.lastOilKm===""?null:num(d.lastOilKm);
    veh.oilIntervalKm = num(d.oilIntervalKm)||10000;
    veh.oilIntervalMonths = num(d.oilIntervalMonths)||12;
    saveVehicles(); goBack(); return;

  /* -- service records -- */
  case "newService":
    S.modal="service"; pushLayer();
    S.draft={date:todayISO(),km:veh.currentKm||"",items:[],cost:"",notes:"",
             customItem:"",catKey:S.cats[0]?S.cats[0].key:null};
    break;
  case "editService": {
    var r = recsOf(S.selected).filter(function(x){ return x.id===id; })[0];
    if(!r) return;
    S.modal="service"; pushLayer();
    S.draft={id:r.id,date:r.date,km:r.km,items:r.items.slice(),
             cost:r.cost==null?"":String(r.cost),notes:r.notes||"",
             customItem:"",catKey:S.cats[0]?S.cats[0].key:null};
    break;
  }
  case "catTab": d.catKey=v; break;
  case "toggleItem": {
    var arr = d.items||[];
    d.items = arr.indexOf(v)>=0 ? arr.filter(function(x){ return x!==v; }) : arr.concat([v]);
    break;
  }
  case "addCustom": {
    var t=(d.customItem||"").trim();
    if(t && (d.items||[]).indexOf(t)<0) d.items=(d.items||[]).concat([t]);
    d.customItem=""; S.focus=null;
    break;
  }
  case "saveService": {
    var list = recsOf(S.selected).slice();
    var obj = {id:d.id||uid(),date:d.date,km:num(d.km),items:d.items.slice(),
               cost:d.cost===""?null:num(d.cost),notes:(d.notes||"").trim()};
    if(d.id) list = list.map(function(x){ return x.id===d.id?obj:x; });
    else list.push(obj);
    S.records[S.selected]=list; saveRecords(); syncFromHistory(S.selected);
    goBack(); return;
  }
  case "deleteService":
    if(!confirm("Διαγραφή αυτής της καταχώρησης;")) return;
    S.records[S.selected] = recsOf(S.selected).filter(function(x){ return x.id!==d.id; });
    saveRecords(); syncFromHistory(S.selected);
    goBack(); return;

  /* -- category manager -- */
  case "openCats": S.prevDraft=S.draft; S.prevModal=S.modal; S.modal="cats"; S.draft={}; pushLayer(); break;
  case "closeCats": goBack(); return;
  case "expandCat": d.expanded = d.expanded===v?null:v; break;
  case "moveCat": {
    var i1=-1; S.cats.forEach(function(c,i){ if(c.key===v) i1=i; });
    var j=i1+dir; if(j<0||j>=S.cats.length) return;
    var tmp=S.cats[i1]; S.cats[i1]=S.cats[j]; S.cats[j]=tmp; saveCats();
    break;
  }
  case "delCat":
    if(!confirm("Διαγραφή κατηγορίας;")) return;
    S.cats = S.cats.filter(function(c){ return c.key!==v; }); saveCats();
    break;
  case "renCat": {
    var c0 = S.cats.filter(function(c){ return c.key===v; })[0];
    d.renCat=v; d.renCatVal=c0?c0.label:""; S.focus="renCatVal";
    break;
  }
  case "renCatSave": {
    var nv=(d.renCatVal||"").trim();
    if(nv) S.cats.forEach(function(c){ if(c.key===v) c.label=nv; });
    d.renCat=null; saveCats(); S.focus=null;
    break;
  }
  case "moveItem": {
    S.cats.forEach(function(c){
      if(c.key!==v) return;
      var i1=c.items.indexOf(it), j=i1+dir;
      if(i1<0||j<0||j>=c.items.length) return;
      var t=c.items[i1]; c.items[i1]=c.items[j]; c.items[j]=t;
    });
    saveCats();
    break;
  }
  case "delItem":
    S.cats.forEach(function(c){
      if(c.key===v) c.items=c.items.filter(function(x){ return x!==it; });
    });
    saveCats();
    break;
  case "renItem": d.renItem=v+"::"+it; d.renItemVal=it; S.focus="renItemVal"; break;
  case "renItemSave": {
    var nv2=(d.renItemVal||"").trim();
    if(nv2){
      S.cats.forEach(function(c){
        if(c.key===v) c.items=c.items.map(function(x){ return x===it?nv2:x; });
      });
      // keep already-saved records consistent with the rename
      Object.keys(S.records).forEach(function(k){
        S.records[k].forEach(function(r){
          r.items = r.items.map(function(x){ return x===it?nv2:x; });
        });
      });
      saveRecords();
    }
    d.renItem=null; saveCats(); S.focus=null;
    break;
  }
  case "addItem": {
    var t2=(d["newItem_"+v]||"").trim();
    if(t2) S.cats.forEach(function(c){
      if(c.key===v && c.items.indexOf(t2)<0) c.items.push(t2);
    });
    d["newItem_"+v]=""; saveCats(); S.focus=null;
    break;
  }
  case "startAddCat":
    d.addingCat=true; d.newCatLabel=""; d.newCatColor=COLOR_KEYS[0]; d.newCatIcon=ICON_KEYS[0];
    break;
  case "cancelAddCat": d.addingCat=false; break;
  case "pickColor": d.newCatColor=v; break;
  case "pickIcon":  d.newCatIcon=v; break;
  case "addCat": {
    var lb=(d.newCatLabel||"").trim(); if(!lb) return;
    S.cats.push({key:uid(),label:lb,icon:d.newCatIcon||"cog",
                 color:d.newCatColor||"amber",items:[]});
    d.addingCat=false; saveCats(); S.focus=null;
    break;
  }
  }
  render();
});

function closeModal(){ S.modal=null; S.draft={}; S.focus=null; render(); }

/* ---------------- Browser back button ----------------
   Each screen/dialog pushes an entry, so the phone's Back button peels off one
   layer at a time instead of leaving the app. Only at the top-level garage list
   does Back exit, which is the behaviour people expect. */
var layers = 0;
function pushLayer(){
  layers++;
  try{ history.pushState({app:layers}, ""); }catch(e){}
}
function consumeLayer(){ if(layers>0) layers--; }
function goBack(){
  if(layers>0) history.back();   // popstate below performs the actual change
  else { closeModal(); S.selected=null; render(); }
}
window.addEventListener("popstate", function(){
  consumeLayer();
  if(S.modal==="cats"){ S.modal=S.prevModal; S.draft=S.prevDraft||{}; S.focus=null; render(); }
  else if(S.modal){ closeModal(); }
  else if(S.selected){ S.selected=null; window.scrollTo(0,0); render(); }
  // At the list with no layers left, the browser handles Back normally.
});

// Close the brand suggestion list when tapping elsewhere.
document.addEventListener("click", function(e){
  if(S.modal==="vehicle" && S.draft.acOpen && !e.target.closest(".ac") && !e.target.closest("[data-act]")){
    S.draft.acOpen=false; render();
  }
});

render();
</script>
